name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  swift-test:
    name: Swift Tests
    runs-on: macos-15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Show Xcode version
      run: xcodebuild -version

    - name: Run tests
      run: |
        xcodebuild test \
          -scheme Arrstatus \
          -destination 'platform=macOS' \
          -only-testing:ArrstatusTests \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

    - name: Test Summary
      if: always()
      run: echo "✅ Swift unit tests completed"

  python:
    name: Python lint and tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install ruff
      run: pip install ruff

    - name: Lint
      run: ruff check waybar/arrstatus.py waybar/test_arrstatus.py

    - name: Run tests
      run: python3 waybar/test_arrstatus.py -v
