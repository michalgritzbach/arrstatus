<svg width="720" height="240" viewBox="0 0 720 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#2E5F5D"/>

  <!-- Frame -->
  <rect x="32" y="56" width="656" height="128"
        fill="none" stroke="#E6E6E6" stroke-width="4"/>

  <!-- Divider -->
  <line x1="168" y1="56" x2="168" y2="184"
        stroke="#E6E6E6" stroke-width="4"/>

  <!-- Icon -->
  <g stroke="#E6E6E6" stroke-width="4" fill="none" stroke-linecap="square">

    <!-- segmented incoming lines -->
    <line x1="72" y1="88" x2="88" y2="88"/>
    <line x1="96" y1="88" x2="112" y2="88"/>
    <line x1="120" y1="88" x2="136" y2="88"/>

    <!-- arrow shaft -->
    <line x1="104" y1="88" x2="104" y2="132"/>

    <!-- arrow head -->
    <polyline points="88,120 104,136 120,120"/>

    <!-- completion check (integrated into base) -->
    <polyline points="88,144 100,156 124,132"/>

  </g>

  <!-- Text -->
  <text x="200" y="138"
        fill="#E6E6E6"
        font-family="Space Mono, monospace"
        font-size="56"
        letter-spacing="2">
    Arrstatus
  </text>
</svg>
